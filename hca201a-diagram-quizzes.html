<style>
* { box-sizing: border-box }
body { margin: 0; background: #eef5f3; color: #172e2c; font: 1rem/1.45 system-ui,sans-serif }
main { width: min(100% - 24px, 1000px); margin: 24px auto }
h1 { margin: 0; font-size: clamp(1.6rem, 5vw, 2.6rem) }
nav, .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1rem 0 }
button { font: inherit; color: inherit; background: #fff; border: 1px solid #7c9a95; border-radius: .45rem; padding: .55rem .75rem; cursor: pointer; min-height: 44px }
button[aria-pressed="true"], .primary { background: #096657; border-color: #096657; color: white }
button:disabled { cursor: default }
button:focus-visible { outline: 3px solid #236eb4; outline-offset: 3px }
article { background: #fff; border: 1px solid #c3d6d2; border-radius: .8rem; padding: clamp(.85rem, 3vw, 1.5rem) }
.layout { display: grid; grid-template-columns: 1.12fr 1fr; gap: 1.25rem; align-items: start }
figure { position: relative; width: 100%; margin: 0 }
figure img { display: block; width: 100%; height: auto }
.marker { position: absolute; width: 16px; height: 16px; transform: translate(-50%, -50%); border: 3px solid white; border-radius: 50%; box-shadow: 0 0 0 2px #981f52; background: #981f52; pointer-events: none }
#options { display: grid; gap: .5rem }
#options button { text-align: left }
#options button.correct { border-color: #096657; background: #ddf5e9 }
#options button.wrong { border-color: #a23a32; background: #fde9e5 }
#feedback { margin-top: .85rem; padding: .75rem; border-left: 4px solid #096657; background: #eff7f4 }
#feedback.wrong { border-color: #a23a32; background: #fff3ef }
#feedback p { margin: .25rem 0 }
.muted { color: #435f5a }
h2 { margin: 0 0 .5rem; font-size: 1.2rem }
@media(max-width:690px) { .layout { grid-template-columns: 1fr } figure { width: min(100%, 420px); margin-inline: auto } }
[hidden] { display: none !important }
.back { display: inline-flex; align-items: center; min-height: 44px; margin-bottom: .6rem; padding: .45rem .7rem; border: 1px solid #7c9a95; border-radius: .45rem; background: white; color: #096657; font-weight: 650; text-decoration: none }
.back:focus-visible { outline: 3px solid #236eb4; outline-offset: 3px }
</style>

<h1>HCA201A Diagram Quizzes</h1>
<p>Choose a diagram and identify the structure indicated by the line with the pink marker.</p>

  </div>
</article>

const el = id => document.getElementById(id);
let current, deck, at, missed, answered;

function shuffled(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function start(diagram, subset = diagram.questions, focus = true) {
  current = diagram;
  deck = shuffled(subset);
  at = 0;
  missed = [];
  for (const button of el("topics").children) {
    button.setAttribute("aria-pressed", String(button.dataset.topic === diagram.name));
  }
  el("summary").hidden = true;
  el("practice").hidden = false;
  el("diagram").src = diagram.image;
  el("diagram").alt = diagram.name + " worksheet illustration with the current guide line marked in pink.";
  render(focus);
}

function render(focus = true) {
  answered = false;
  const q = deck[at];
  el("position").textContent = current.name + " · Label " + (at + 1) + " of " + deck.length;
  el("prompt").textContent = "What does the marked guide line point to?";
  el("marker").style.left = (q.x / current.width * 100) + "%";
  el("marker").style.top = (q.y / current.height * 100) + "%";
  el("feedback").hidden = true;
  el("feedback").replaceChildren();
  el("next").disabled = true;
  el("next").textContent = at === deck.length - 1 ? "Review results" : "Next label";
  const choices = shuffled([q.answer, ...q.distractors]);
  el("options").replaceChildren(...choices.map((choice, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = String.fromCharCode(65 + index) + ". " + choice;
    button.addEventListener("click", () => reveal(q, index, choices));
    return button;
  }));
  if (focus) el("prompt").focus();
}

function reveal(q, selected, choices) {
  if (answered) return;
  answered = true;
  const right = choices[selected] === q.answer;
  if (!right) missed.push(q);
  Array.from(el("options").children).forEach((button, index) => {
    button.disabled = true;
    if (choices[index] === q.answer) button.classList.add("correct");
    if (!right && index === selected) button.classList.add("wrong");
  });
  const heading = document.createElement("strong");
  heading.textContent = right ? "Correct." : "Incorrect. The correct answer is " + q.answer + ".";
  const explanation = document.createElement("p");
  explanation.textContent = q.explanation;
  const reading = document.createElement("p");
  reading.className = "muted";
  reading.textContent = "Textbook: Sorrentino, 5th ed. · Ch. 32, Body Structure and Function › " + current.section;
  const feedback = el("feedback");
  feedback.classList.toggle("wrong", !right);
  feedback.replaceChildren(heading, explanation, reading);
  feedback.hidden = false;
  el("next").disabled = false;
  feedback.focus();
}

function showSummary() {
  el("practice").hidden = true;
  el("summary").hidden = false;
  el("score").textContent = current.name + " · " + (deck.length - missed.length) + " of " + deck.length + " correct";
  el("detail").textContent = missed.length ? "Review these labels, then try them again." : "You identified every label in this round.";
  el("missed").hidden = missed.length === 0;
  el("missed").replaceChildren(...missed.map(q => {
    const item = document.createElement("li");
    item.textContent = q.answer + " — " + q.explanation;
    return item;
  }));
  el("retry").hidden = missed.length === 0;
  el("score").focus();
}

for (const diagram of diagrams) {
  const button = document.createElement("button");
  button.type = "button";
  button.dataset.topic = diagram.name;
  button.textContent = diagram.name + " (" + diagram.questions.length + ")";
  button.addEventListener("click", () => {
    if (current !== diagram) start(diagram);
  });
  el("topics").append(button);
}
el("next").addEventListener("click", () => {
  if (!answered) return;
  at++;
  if (at === deck.length) showSummary();
  else render();
});
el("retry").addEventListener("click", () => start(current, missed));
el("restart").addEventListener("click", () => start(current));
start(diagrams[0], diagrams[0].questions, false);
</script>
