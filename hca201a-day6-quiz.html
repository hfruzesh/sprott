.choice.wrong { background: #fceef1; border-color: #af4660; }

</script>
<script>
const questionBank = JSON.parse(document.getElementById("question-bank").textContent);
const letters = ["A", "B", "C", "D"];
const quiz = document.getElementById("quiz");
const prompt = document.getElementById("prompt");
const answers = document.getElementById("answers");
const feedback = document.getElementById("feedback");
const counter = document.getElementById("counter");
const topic = document.getElementById("topic");
const progress = document.getElementById("progress");
const score = document.getElementById("score");
const next = document.getElementById("next");
const result = document.getElementById("result");
const summary = document.getElementById("summary");
const review = document.getElementById("review");

let choices;
let position;
let correctCount;
let answered;
let missed;

function shuffle(values) {
  const items = [...values];
  for (let index = items.length - 1; index > 0; index--) {
    const other = Math.floor(Math.random() * (index + 1));
    [items[index], items[other]] = [items[other], items[index]];
  }
  return items;
}

function showQuestion(moveFocus) {
  const question = questionBank[position];
  const { group, stem, options } = question;
  answered = false;
  counter.textContent = `Question ${position + 1} of ${questionBank.length}`;
  topic.textContent = group;
  prompt.textContent = stem;
  score.textContent = `Correct: ${correctCount} / ${position}`;
  feedback.replaceChildren();
  next.disabled = true;
  next.textContent = position === questionBank.length - 1 ? "See results →" : "Next question →";

  const buttons = choices[position].map((option, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "choice";
    const letter = document.createElement("span");
    letter.className = "letter";
    letter.textContent = letters[index];
    const label = document.createElement("span");
    label.textContent = options[option];
    button.append(letter, label);
    button.addEventListener("click", () => markAnswer(question, option, button));
    return button;
  });
  answers.replaceChildren(...buttons);
  if (moveFocus) prompt.focus({ preventScroll: true });
}

function markAnswer(question, selected, button) {
  if (answered) return;
  answered = true;
  const isCorrect = selected === 0;
  const correctIndex = choices[position].indexOf(0);
  const correctButton = answers.children[correctIndex];

  for (const choice of answers.children) {
    choice.setAttribute("aria-disabled", "true");
    choice.tabIndex = -1;
  }
  correctButton.classList.add("correct");
  if (isCorrect) {
    correctCount++;
  } else {
    button.classList.add("wrong");
    missed.push({ number: position + 1, question, selected });
  }
  score.textContent = `Correct: ${correctCount} / ${position + 1}`;
  progress.value = position + 1;
  const verdict = document.createElement("strong");
  verdict.textContent = isCorrect ? "Correct. " : `Correct answer: ${letters[correctIndex]}. ${question.options[0]}. `;
  feedback.replaceChildren(verdict, `${question.explanation} (Day 6 notes, pp. ${question.pages})`);
  next.disabled = false;
}

function showResults() {
  quiz.hidden = true;
  result.hidden = false;
  summary.textContent = `${correctCount} / ${questionBank.length} correct`;
  document.getElementById("result-detail").textContent = missed.length
    ? `Review the ${missed.length} ${missed.length === 1 ? "question" : "questions"} you missed below.`
    : "You answered every question correctly.";
  review.replaceChildren(...missed.map(({ number, question, selected }) => {
    const item = document.createElement("li");
    item.value = number;
    const stem = document.createElement("strong");
    stem.textContent = question.stem;
    const chosen = document.createElement("p");
    chosen.textContent = `Your answer: ${question.options[selected]}`;
    const correct = document.createElement("p");
    correct.textContent = `Correct answer: ${question.options[0]}`;
    const explanation = document.createElement("p");
    explanation.textContent = `${question.explanation} (Day 6 notes, pp. ${question.pages})`;
    item.append(stem, chosen, correct, explanation);
    return item;
  }));
  summary.focus();
}

function startRound(moveFocus) {
  choices = questionBank.map(() => shuffle([0, 1, 2, 3]));
  position = 0;
  correctCount = 0;
  missed = [];
  progress.max = questionBank.length;
  progress.value = 0;
  result.hidden = true;
  quiz.hidden = false;
  showQuestion(moveFocus);
  if (moveFocus) window.scrollTo(0, 0);
}

next.addEventListener("click", () => {
  if (!answered) return;
  position++;
  if (position === questionBank.length) {
    showResults();
  } else {
    showQuestion(true);
  }
});
document.getElementById("restart").addEventListener("click", () => startRound(true));
startRound(false);
</script>
